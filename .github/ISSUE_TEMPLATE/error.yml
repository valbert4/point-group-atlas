name: Report an error
description: A wrong value, symbol or statement in the tables, the conventions, the PDFs or the site.
title: "Error: "
body:
  - type: markdown
    attributes:
      value: |
        One error per report, please. The site's "Report an error" link fills in the address and the version.
        A character that is the complex conjugate of another table's, or a matrix that is the transpose or the adjoint of another table's, may follow from the convention of CONVENTIONS.md section 4.3 and not be an error.
  - type: input
    id: address
    attributes:
      label: Where
      description: The address on the site, or the PDF and its section, table or equation number.
      placeholder: https://valbert4.github.io/point-group-atlas/rotation/C3v/character_table/
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: What is wrong
      description: The entry as it stands, and what it should be.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How you know
      description: A reference (with its table or equation) or a computation.
  - type: input
    id: version
    attributes:
      label: Version
      description: The site's link fills this in; for a volume PDF, the commit on its title sheet.
